name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test --ci

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: pnpm exec supabase start -x realtime,studio,logflare,vector,imgproxy,supavisor
      - name: pgTAP
        run: pnpm exec supabase test db
      - name: Generated types are up to date
        run: |
          pnpm exec supabase gen types typescript --local \
            | pnpm exec prettier --stdin-filepath apps/mobile/src/lib/database.types.ts > /tmp/types.ts
          diff -u apps/mobile/src/lib/database.types.ts /tmp/types.ts
      - name: Edge Function tests
        run: |
          set -a; eval "$(pnpm exec supabase status -o env)"; set +a
          deno test supabase/functions --allow-env --allow-net
